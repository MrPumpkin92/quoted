<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock Screen: Finish the line</title>
<link rel="stylesheet" href="shared.css">
<style>
.wall { background: radial-gradient(120% 75% at 28% 18%, #5C70B6 0%, #34437A 48%, #1C2446 100%); }
.date { position: absolute; top: 76px; left: 0; right: 0; text-align: center; font-size: 21px; line-height: 26px; font-weight: 600; color: rgba(255, 255, 255, 0.86); }
.clock { position: absolute; top: 98px; left: 0; right: 0; text-align: center; font-size: 112px; line-height: 112px; font-weight: 700; letter-spacing: -2px; color: rgba(255, 255, 255, 0.94); }

.lock-widget { position: absolute; top: 230px; left: 50%; width: 176px; margin-left: -88px; color: #FFFFFF; }
.lock-widget .label { font-size: 13px; line-height: 16px; font-weight: 600; opacity: 0.72; }
.lock-widget .cue { font-size: 18px; line-height: 24px; margin-top: 2px; white-space: nowrap; word-spacing: 0.2em; }
.lock-widget .who { font-size: 13px; line-height: 16px; opacity: 0.72; margin-top: 2px; }

.note {
  position: absolute; left: 12px; right: 12px; bottom: 138px; padding: 14px 16px 14px 14px; border-radius: 24px;
  background: rgba(246, 246, 250, 0.80); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  box-shadow: 0 10px 30px rgba(10, 14, 40, 0.25); display: flex; gap: 12px; align-items: flex-start;
}
.app-icon { flex: none; width: 38px; height: 38px; border-radius: 9px; background: #2D46CC; color: #FFFFFF; display: flex; align-items: center; justify-content: center; }
.app-icon span { font-family: var(--serif); font-weight: 600; font-size: 24px; line-height: 24px; margin-top: 1px; }
.note .body { flex: 1; min-width: 0; font-size: 15px; line-height: 20px; }
.note .top { display: flex; justify-content: space-between; align-items: baseline; }
.note .title { font-weight: 600; }
.note .time { font-size: 13px; color: var(--secondary); }
.note .cue { word-spacing: 0.25em; }

.round { position: absolute; bottom: 44px; width: 50px; height: 50px; border-radius: 25px; background: rgba(12, 16, 36, 0.34); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; }
.round svg { display: block; }
</style>
</head>
<body>
<div class="canvas wall" role="img" aria-label="Lock Screen with a Quoted reminder: Finish the line, T a a: t t o s b t.">
  <div class="island"></div>
  <div class="statusbar light">
    <span></span>
    <span class="icons">
      <svg width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.2c2.4 0 4.7.9 6.4 2.5l1.3-1.3C14.1 1.4 11.4.4 8.5.4S2.9 1.4.8 3.4l1.3 1.3C3.8 3.1 6.1 2.2 8.5 2.2zm0 3.5c1.5 0 2.9.6 4 1.6l1.3-1.3C12.8 4.6 10.7 3.8 8.5 3.8S4.2 4.6 2.7 6l1.3 1.3c1.1-1 2.5-1.6 4.5-1.6zm0 3.4c.7 0 1.3.3 1.8.7L8.5 11.6 6.7 9.8c.5-.4 1.1-.7 1.8-.7z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" opacity=".45"/></svg>
    </span>
  </div>

  <div class="date">Thursday, October 29</div>
  <div class="clock">9:41</div>

  <div class="lock-widget" aria-label="Quoted widget: Finish the line">
    <div class="label">Finish the line</div>
    <div class="cue serif">T a a: t t o s b t.</div>
    <div class="who">Shakespeare</div>
  </div>

  <div class="note" role="status" aria-label="Notification from Quoted">
    <div class="app-icon" aria-hidden="true"><span>Q</span></div>
    <div class="body">
      <div class="top"><span class="title">Finish the line</span><span class="time">now</span></div>
      <div>William Shakespeare, Hamlet</div>
      <div class="cue">T a a: t t o s b t.</div>
    </div>
  </div>

  <div class="round" style="left: 46px;" aria-hidden="true">
    <svg width="22" height="26" viewBox="0 0 22 26" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M5 2h12v4l-3 5v12a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V11L5 6z"/><path d="M5 6h12"/><circle cx="11" cy="15" r="1.4" fill="#fff" stroke="none"/></svg>
  </div>
  <div class="round" style="right: 46px;" aria-hidden="true">
    <svg width="26" height="22" viewBox="0 0 26 22" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6h4.5l2-3h7l2 3H23a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 23 20H3a1.5 1.5 0 0 1-1.5-1.5v-11A1.5 1.5 0 0 1 3 6z"/><circle cx="13" cy="12.5" r="4.2"/></svg>
  </div>

  <div class="home-indicator light"></div>
</div>
</body>
</html>
