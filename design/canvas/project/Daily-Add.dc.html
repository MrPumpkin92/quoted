<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily - Add quote</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap">
<style>
body{margin:0}
a{color:#C63F24}a:hover{color:#A8341D}
.q{font-family:'Fraunces',ui-serif,serif;font-optical-sizing:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-appearance:none;appearance:none}
.fld{font:inherit;color:inherit;border:0;background:transparent;outline:none;padding:0;margin:0;min-width:0;-webkit-appearance:none;appearance:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #A5A3A2; font-family: 'Figtree', -apple-system, system-ui, sans-serif; color: #1F1A17">
  <section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position:absolute;top:62px;left:0;right:0;bottom:0;background:#FFFFFF;border-radius:32px 32px 0 0;box-shadow:0 -8px 32px rgba(31,26,23,0.12)">
    <div aria-hidden="true" style="position:absolute;top:8px;left:177px;width:36px;height:5px;border-radius:3px;background:rgba(31,26,23,0.2)"></div>

    <div style="position:absolute;top:20px;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between">
      <button class="btn" type="button" style="height:44px;padding:0 16px;font-size:17px;line-height:24px;color:rgba(31,26,23,0.8)">Cancel</button>
      <h2 id="sheet-title" style="position:absolute;left:0;right:0;top:10px;margin:0;text-align:center;font-size:17px;line-height:24px;font-weight:600;pointer-events:none">New quote</h2>
      <button class="btn" type="button" style="height:44px;padding:0 16px;font-size:17px;line-height:24px;font-weight:600;color:#C63F24">Save</button>
    </div>

    <div style="position:absolute;top:80px;left:16px;right:16px;box-sizing:border-box;padding:24px;border-radius:32px;background:#F3EBDD;box-shadow:0 8px 24px rgba(120,90,50,0.12)">
      <span id="quote-label" class="sr">Quote text</span>
      <div role="textbox" aria-multiline="true" aria-labelledby="quote-label" class="q" style="min-height:176px;font-size:34px;line-height:44px;letter-spacing:-0.2px"><strong style="font-weight:600;background:rgba(198,63,36,0.16);border-radius:4px">Trust thyself</strong>: every heart vibrates to that <u style="text-decoration-thickness:2px;text-underline-offset:6px">iron string</u>.</div>
    </div>

    <div style="position:absolute;top:328px;left:16px;right:16px;border-radius:20px;background:#F7F5F2">
      <div style="display:flex;align-items:center;gap:12px;height:52px;padding:0 16px">
        <label for="author" style="width:64px;flex:none;font-size:17px;line-height:24px;color:rgba(31,26,23,0.66)">Author</label>
        <input id="author" class="fld" type="text" value="Ralph Waldo Emerson" style="flex:1;font-size:17px;line-height:24px">
      </div>
      <div aria-hidden="true" style="height:1px;margin-left:16px;background:rgba(31,26,23,0.08)"></div>
      <div style="display:flex;align-items:center;gap:12px;height:52px;padding:0 16px">
        <label for="source" style="width:64px;flex:none;font-size:17px;line-height:24px;color:rgba(31,26,23,0.66)">Source</label>
        <input id="source" class="fld" type="text" value="Self-Reliance" style="flex:1;font-size:17px;line-height:24px">
        <span style="flex:none;font-size:13px;line-height:18px;color:rgba(31,26,23,0.66)">Optional</span>
      </div>
      <div aria-hidden="true" style="height:1px;margin-left:16px;background:rgba(31,26,23,0.08)"></div>
      <div style="display:flex;align-items:center;gap:12px;height:52px;padding:0 16px">
        <span id="color-label" style="width:64px;flex:none;font-size:17px;line-height:24px;color:rgba(31,26,23,0.66)">Color</span>
        <div role="radiogroup" aria-labelledby="color-label" style="display:flex;margin-left:-8px">
          <button class="btn" type="button" role="radio" aria-checked="true" aria-label="Sand" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><span style="width:28px;height:28px;border-radius:14px;background:#F3EBDD;box-shadow:0 0 0 2px #F7F5F2, 0 0 0 4px #1F1A17"></span></button>
          <button class="btn" type="button" role="radio" aria-checked="false" aria-label="Blush" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><span style="width:28px;height:28px;border-radius:14px;background:#F6E3E1;box-shadow:inset 0 0 0 1px rgba(31,26,23,0.12)"></span></button>
          <button class="btn" type="button" role="radio" aria-checked="false" aria-label="Sage" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><span style="width:28px;height:28px;border-radius:14px;background:#E3EDE4;box-shadow:inset 0 0 0 1px rgba(31,26,23,0.12)"></span></button>
          <button class="btn" type="button" role="radio" aria-checked="false" aria-label="Sky" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><span style="width:28px;height:28px;border-radius:14px;background:#E1ECF6;box-shadow:inset 0 0 0 1px rgba(31,26,23,0.12)"></span></button>
          <button class="btn" type="button" role="radio" aria-checked="false" aria-label="Lilac" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><span style="width:28px;height:28px;border-radius:14px;background:#ECE6F4;box-shadow:inset 0 0 0 1px rgba(31,26,23,0.12)"></span></button>
        </div>
      </div>
    </div>

    <div style="position:absolute;top:510px;left:16px;right:16px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 16px;border-radius:20px;background:#F7F5F2">
        <span id="rotation-label" style="font-size:17px;line-height:24px">Add to Rotation</span>
        <button class="btn" type="button" role="switch" aria-checked="true" aria-labelledby="rotation-label" style="position:relative;width:51px;height:31px;flex:none;border-radius:16px;background:#C63F24"><span style="position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:14px;background:#FFFFFF;box-shadow:0 2px 4px rgba(31,26,23,0.20)"></span></button>
      </div>
      <p style="margin:0;padding:0 16px;font-size:13px;line-height:18px;color:rgba(31,26,23,0.66)">It joins your widgets and reminders.</p>
    </div>

    <div style="position:absolute;left:16px;right:16px;bottom:42px;height:52px;display:flex;align-items:center;justify-content:space-between">
      <div role="toolbar" aria-label="Text style" style="height:52px;box-sizing:border-box;padding:4px;display:flex;gap:4px;border-radius:26px;background:rgba(255,255,255,0.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(31,26,23,0.08);box-shadow:0 8px 24px rgba(31,26,23,0.10)">
        <button class="btn" type="button" aria-label="Bold" aria-pressed="true" style="width:44px;height:42px;border-radius:21px;background:#C63F24;color:#FFFFFF;text-align:center;font-size:17px;line-height:24px;font-weight:600">B</button>
        <button class="btn" type="button" aria-label="Italic" aria-pressed="false" style="width:44px;height:42px;border-radius:21px;text-align:center;font-size:17px;line-height:24px;font-style:italic;color:rgba(31,26,23,0.8)">I</button>
        <button class="btn" type="button" aria-label="Underline" aria-pressed="false" style="width:44px;height:42px;border-radius:21px;text-align:center;font-size:17px;line-height:24px;text-decoration:underline;text-underline-offset:3px;color:rgba(31,26,23,0.8)">U</button>
      </div>
      <button class="btn" type="button" style="height:52px;box-sizing:border-box;padding:0 20px 0 16px;display:flex;align-items:center;gap:8px;border-radius:26px;background:rgba(255,255,255,0.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(31,26,23,0.08);box-shadow:0 8px 24px rgba(31,26,23,0.10);font-size:17px;line-height:24px;font-weight:600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4.5H7.5a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V6.5a2 2 0 0 0-2-2H15"></path><rect x="9" y="3" width="6" height="3.5" rx="1.25"></rect></svg>
        <span>Paste</span>
      </button>
    </div>

    <div aria-hidden="true" style="position:absolute;left:128px;bottom:8px;width:134px;height:5px;border-radius:3px;background:#1F1A17"></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

return {};
}

</body>
</html>
