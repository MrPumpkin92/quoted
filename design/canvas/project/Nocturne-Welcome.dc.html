<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,500;0,700;1,500;1,700&display=swap">
<style>
body{margin:0}
a{color:#FFB547}a:hover{color:#FFC978}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
input{font:inherit;color:inherit}
.q{font-family:'Schibsted Grotesk',-apple-system,system-ui,sans-serif}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #0C0C0E; font-family: -apple-system, system-ui, sans-serif; color: #F5F5F4; font-weight: 500">

  <header style="position: absolute; top: 72px; left: 16px; right: 16px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 8px; background: #FFB547; color: #1A1206; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path fill="currentColor" stroke-width="1" d="M3 13.5C3 9.5 5.2 6.9 9 6l.6 1.6c-2 .8-3.1 2-3.3 3.6.3-.1.7-.2 1.1-.2 1.7 0 3.1 1.3 3.1 3s-1.4 3-3.2 3C4.9 17 3 15.6 3 13.5z"/><path fill="currentColor" stroke-width="1" d="M13 13.5c0-4 2.2-6.6 6-7.5l.6 1.6c-2 .8-3.1 2-3.3 3.6.3-.1.7-.2 1.1-.2 1.7 0 3.1 1.3 3.1 3s-1.4 3-3.2 3c-2.4 0-4.3-1.4-4.3-3.5z"/></svg>
      </span>
      <h1 class="q" style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.01em">Quoted</h1>
    </div>
    <p style="margin: 16px 0 0; font-size: 17px; line-height: 22px; color: rgba(245,245,244,0.64)">Keep the words that move you, and see them again every day.</p>
  </header>

  <figure style="position: absolute; top: 280px; left: 16px; right: 16px; margin: 0">
    <blockquote class="q" style="margin: 0; font-size: 34px; line-height: 40px; font-weight: 500; letter-spacing: -0.01em; color: #F5F5F4">Beware; for I am <em style="font-style: italic">fearless</em>, and therefore powerful.</blockquote>
    <figcaption style="margin-top: 16px; font-size: 13px; line-height: 16px; color: rgba(245,245,244,0.64)">Mary Shelley, Frankenstein</figcaption>
  </figure>

  <form aria-label="Sign in" style="position: absolute; left: 16px; right: 16px; bottom: 34px; margin: 0; display: flex; flex-direction: column">
    <div style="background: #161619; border: 1px solid rgba(255,255,255,0.08); border-radius: 24px">
      <div style="display: flex; align-items: center; height: 52px; padding: 0 16px">
        <label for="nw-email" style="width: 96px; flex: none; font-size: 17px; line-height: 22px; color: rgba(245,245,244,0.64)">Email</label>
        <input id="nw-email" class="f" type="email" autocomplete="email" placeholder="you@example.com" style="flex: 1; min-width: 0; height: 44px; padding: 0; background: none; border: 0; outline: none; font-size: 17px; color: #F5F5F4">
      </div>
      <div aria-hidden="true" style="height: 1px; margin-left: 16px; background: rgba(255,255,255,0.08)"></div>
      <div style="display: flex; align-items: center; height: 52px; padding: 0 16px">
        <label for="nw-pass" style="width: 96px; flex: none; font-size: 17px; line-height: 22px; color: rgba(245,245,244,0.64)">Password</label>
        <input id="nw-pass" class="f" type="password" autocomplete="current-password" placeholder="Required" style="flex: 1; min-width: 0; height: 44px; padding: 0; background: none; border: 0; outline: none; font-size: 17px; color: #F5F5F4">
      </div>
    </div>
    <button type="submit" style="margin-top: 24px; height: 56px; border-radius: 28px; background: #FFB547; color: #1A1206; font-size: 17px; font-weight: 700; box-shadow: 0 8px 24px rgba(4,4,8,0.56)">Sign in</button>
    <button type="button" style="margin-top: 8px; height: 44px; border-radius: 22px; font-size: 17px; color: #F5F5F4">Create account</button>
  </form>

  <div aria-hidden="true" style="position: absolute; left: 128px; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; background: #F5F5F4"></div>
</div>
