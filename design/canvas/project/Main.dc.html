<style>
body{margin:0}
a{color:#2B44C9}a:hover{color:#1F33A0}
.q{font-family:'Newsreader',serif;font-optical-sizing:auto}
.au{font-size:13px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;color:rgba(22,22,26,.62)}
.b{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;outline:0;box-sizing:border-box;-webkit-appearance:none;appearance:none}
.b::placeholder{color:rgba(22,22,26,.62);opacity:1}

<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #F8F8F6; font-family: -apple-system, system-ui, sans-serif; color: #16161A">

  <div style="position: absolute; top: 54px; left: 24px; right: 24px; bottom: 40px; display: flex; flex-direction: column;">

    <header style="padding-top: 16px;">
      <h1 class="q" style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em;">Quoted<span style="color: #2B44C9;">.</span></h1>
      <p style="margin: 4px 0 0; font-size: 17px; line-height: 22px; color: rgba(22,22,26,0.62);">Keep the words that move you.</p>
    </header>

    <figure style="flex: 1; margin: 0; display: flex; flex-direction: column; justify-content: center; padding-bottom: 24px;">
      <blockquote class="q" style="position: relative; margin: 0; font-size: 34px; line-height: 40px; font-weight: 400; letter-spacing: -0.01em;"><span aria-hidden="true" style="position: absolute; left: -15px; top: 0;">“</span>Beware; for I am <em>fearless</em>, and therefore powerful.”</blockquote>
      <figcaption style="margin-top: 16px; display: flex; align-items: baseline; gap: 8px;">
        <span class="au">Mary Shelley</span>
        <cite class="q" style="font-size: 13px; line-height: 16px; font-style: italic; color: rgba(22,22,26,0.62);">Frankenstein</cite>
      </figcaption>
    </figure>

    <form aria-label="Sign in" style="margin: 0; display: flex; flex-direction: column;">
      <div style="background: #FFFFFF; border-radius: 16px; box-shadow: 0 0 0 1px #E6E4DF, 0 4px 16px rgba(22,22,26,0.04);">
        <div style="height: 64px; box-sizing: border-box; padding: 12px 16px;">
          <label for="email" style="display: block; font-size: 13px; line-height: 16px; color: rgba(22,22,26,0.62);">Email</label>
          <input id="email" class="b" type="email" autocomplete="email" placeholder="name@example.com" style="display: block; width: 100%; margin-top: 4px; height: 20px; font-size: 17px; line-height: 20px; color: #16161A;">
        </div>
        <div aria-hidden="true" style="height: 1px; margin-left: 16px; background: #E6E4DF;"></div>
        <div style="height: 64px; box-sizing: border-box; padding: 12px 16px;">
          <label for="password" style="display: block; font-size: 13px; line-height: 16px; color: rgba(22,22,26,0.62);">Password</label>
          <input id="password" class="b" type="password" autocomplete="current-password" placeholder="Your password" style="display: block; width: 100%; margin-top: 4px; height: 20px; font-size: 17px; line-height: 20px; color: #16161A;">
        </div>
      </div>

      <button class="b" type="submit" style="margin-top: 24px; width: 100%; height: 56px; border-radius: 28px; background: #2B44C9; color: #FFFFFF; font-size: 17px; line-height: 22px; font-weight: 600;">Sign in</button>

      <button class="b" type="button" style="margin-top: 8px; width: 100%; height: 44px; font-size: 17px; line-height: 22px;"><span style="color: rgba(22,22,26,0.62);">New here?</span> <span style="font-weight: 600;">Create account</span></button>
    </form>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 128px; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; background: #16161A;"></div>
</div>
