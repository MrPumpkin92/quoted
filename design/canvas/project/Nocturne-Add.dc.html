<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nocturne - Add quote</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,500;0,700;1,500;1,700&display=swap">
<style>
body{margin:0}
a{color:#FFB547}a:hover{color:#FFC978}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
input{font:inherit;color:inherit}
.q{font-family:'Schibsted Grotesk',-apple-system,system-ui,sans-serif}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #000000; font-family: -apple-system, system-ui, sans-serif; color: #F5F5F4; font-weight: 500">

  <div aria-hidden="true" style="position: absolute; top: 54px; left: 16px; right: 16px; height: 48px; border-radius: 24px 24px 0 0; background: #0C0C0E; border: 1px solid rgba(255,255,255,0.08)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="na-title" style="position: absolute; top: 64px; left: 0; right: 0; bottom: 0; background: #161619; border-radius: 32px 32px 0 0; border-top: 1px solid rgba(255,255,255,0.08)">
    <div aria-hidden="true" style="position: absolute; top: 8px; left: 177px; width: 36px; height: 5px; border-radius: 3px; background: rgba(245,245,244,0.32)"></div>

    <header style="position: relative; margin-top: 16px; height: 44px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between">
      <button type="button" style="height: 44px; padding: 0 4px; border-radius: 22px; font-size: 17px; color: #F5F5F4">Cancel</button>
      <h1 id="na-title" style="position: absolute; left: 0; right: 0; top: 0; margin: 0; text-align: center; font-size: 17px; line-height: 44px; font-weight: 700; pointer-events: none">New quote</h1>
      <button type="button" style="position: relative; height: 44px; padding: 0 20px; border-radius: 22px; background: #FFB547; color: #1A1206; font-size: 17px; font-weight: 700">Save</button>
    </header>

    <div role="textbox" aria-multiline="true" aria-label="Quote text" class="q" style="margin: 16px 16px 0; min-height: 232px; box-sizing: border-box; padding: 16px; background: #1E1E22; border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; font-size: 22px; line-height: 28px; color: #F5F5F4"><strong style="font-weight: 700">Trust thyself</strong>: every heart vibrates to that <span style="text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px">iron string</span>.<span aria-hidden="true" style="display: inline-block; width: 2px; height: 26px; margin-left: 2px; vertical-align: -5px; border-radius: 1px; background: #FFB547"></span></div>

    <div style="margin: 24px 16px 0; background: #1E1E22; border: 1px solid rgba(255,255,255,0.08); border-radius: 24px">
      <div style="display: flex; align-items: center; height: 52px; padding: 0 16px">
        <label for="na-author" style="width: 88px; flex: none; font-size: 17px; line-height: 22px; color: rgba(245,245,244,0.64)">Author</label>
        <input id="na-author" type="text" value="Ralph Waldo Emerson" style="flex: 1; min-width: 0; height: 44px; padding: 0; background: none; border: 0; outline: none; font-size: 17px; color: #F5F5F4">
      </div>
      <div aria-hidden="true" style="height: 1px; margin-left: 16px; background: rgba(255,255,255,0.08)"></div>
      <div style="display: flex; align-items: center; height: 52px; padding: 0 16px">
        <label for="na-source" style="width: 88px; flex: none; font-size: 17px; line-height: 22px; color: rgba(245,245,244,0.64)">Source</label>
        <input id="na-source" type="text" value="Self-Reliance" aria-describedby="na-opt" style="flex: 1; min-width: 0; height: 44px; padding: 0; background: none; border: 0; outline: none; font-size: 17px; color: #F5F5F4">
        <span id="na-opt" style="font-size: 13px; line-height: 16px; color: rgba(245,245,244,0.64)">Optional</span>
      </div>
    </div>

    <div style="margin: 24px 16px 0; display: flex; align-items: center; gap: 12px; padding: 16px; background: #1E1E22; border: 1px solid rgba(255,255,255,0.08); border-radius: 24px">
      <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: rgba(255,181,71,0.12); color: #FFB547; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5A8 8 0 0 0 6.3 6.3L4 8.5"/><path d="M4 4v4.5h4.5"/><path d="M4 12.5a8 8 0 0 0 13.7 5.2l2.3-2.2"/><path d="M20 20v-4.5h-4.5"/></svg>
      </span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span id="na-rot" style="font-size: 17px; line-height: 22px">Add to rotation</span>
        <span style="font-size: 13px; line-height: 16px; color: rgba(245,245,244,0.64)">Joins reminders and widgets</span>
      </span>
      <button type="button" role="switch" aria-checked="true" aria-labelledby="na-rot" style="width: 52px; height: 44px; flex: none; display: flex; align-items: center">
        <span aria-hidden="true" style="position: relative; display: block; width: 52px; height: 32px; border-radius: 16px; background: #FFB547">
          <span style="position: absolute; top: 2px; left: 22px; width: 28px; height: 28px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 2px 4px rgba(26,18,6,0.32)"></span>
        </span>
      </button>
    </div>
  </section>

  <div role="toolbar" aria-label="Formatting" style="position: absolute; left: 16px; right: 16px; bottom: 32px; height: 64px; box-sizing: border-box; padding: 0 10px; display: flex; align-items: center; gap: 4px; border-radius: 32px; background: rgba(44,44,50,0.72); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 8px 24px rgba(4,4,8,0.56)">
    <button type="button" aria-label="Bold" aria-pressed="true" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,181,71,0.16); color: #FFB547; font-size: 17px; font-weight: 700">B</button>
    <button type="button" aria-label="Italic" aria-pressed="false" style="width: 44px; height: 44px; border-radius: 22px; color: rgba(245,245,244,0.8); font-size: 17px; font-style: italic">I</button>
    <button type="button" aria-label="Underline" aria-pressed="false" style="width: 44px; height: 44px; border-radius: 22px; color: rgba(245,245,244,0.8); font-size: 17px; text-decoration: underline; text-underline-offset: 3px">U</button>
    <span style="flex: 1"></span>
    <button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; background: rgba(255,255,255,0.12); color: #F5F5F4; font-size: 17px; display: flex; align-items: center; gap: 8px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4.5H7.5a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V6.5a2 2 0 0 0-2-2H15"/><rect x="9" y="3" width="6" height="3.5" rx="1.2"/></svg>
      Paste
    </button>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 128px; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; background: #F5F5F4"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
